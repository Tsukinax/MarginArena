[project]
name = "marginarena"
version = "0.1.0"
description = "Checks whether a marketplace Campaign Invitation makes money before a Seller joins."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]
fit = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marginarena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
